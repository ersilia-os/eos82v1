Status: Ready
Title: SMILES-based Transformer Encoder-Decoder
Description: Produces a 768-dimensional embedding with SMI-TED, the open encoder-decoder
  chemical foundation model that IBM pretrained on 91 million curated PubChem molecules,
  some four billion tokens. Soares and colleagues released a 289-million-parameter
  base network and an eight-expert mixture of the same size, and report competitive
  MoleculeNet results including the quantum properties of QM9. Reconstructing SMILES
  during pretraining gives the latent space chemical structure, but single dimensions
  mean nothing on their own.
