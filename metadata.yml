Identifier: eos82v1
Slug: smi-ted
Status: Ready
Title: SMILES-based Transformer Encoder-Decoder
Description: Produces 768 features from SMI-TED, an encoder-decoder foundation model
  released openly for chemistry and pretrained on a very large corpus of molecular
  strings. Because the architecture retains a decoder, the same representation supports
  generation as well as property prediction, and the authors published several model
  sizes so that cost can be traded against accuracy. The embedding is general-purpose,
  with dimensions that carry no individually interpretable chemical meaning.
